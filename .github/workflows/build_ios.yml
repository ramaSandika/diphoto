name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Xcode Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Build iOS Application (Unsigned)
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package Payload into IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r DiPhoto-unsigned.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPhoto-iOS-Unsigned
          path: build/ios/ipa/DiPhoto-unsigned.ipa
          retention-days: 14
