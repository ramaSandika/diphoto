<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DiPhoto - Digital Photobooth Web Application">
  <meta name="theme-color" content="#0F0B18">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DiPhoto">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DiPhoto - Digital Photobooth</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0F0B18;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #boot-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
    }
    .boot-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 64, 129, 0.2);
      border-top-color: #FF4081;
      border-radius: 50%;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .boot-text {
      margin-top: 18px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div id="boot-loader">
    <div class="boot-spinner"></div>
    <div class="boot-text">DiPHOTO STUDIO</div>
  </div>
  <script src="usb_shutter.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
